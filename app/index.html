<style id="wq35-p30-css">
/* R3.5 p30: arcade lobby, game cards, intro dialog, ready / result panel and arcade-wide touch help.
 * Additive only. Every selector is either a new p30- class or scoped under one, so the R3.3 / R3.4 rules stay the fallback.
 * Colour rule for text: dark ink on a white or cream panel (contrast >= 7:1), never white text on a pastel gradient. */

/* ---- tokens ------------------------------------------------------------------------------------------------------------------- */
.p30-lobby,.a28-dialog.p30-intro,.a28-play,.p30-help,.p30-top-btn{--p30-ink:#1f2f3d;--p30-sub:#465462;--p30-line:#d8d2c3;--p30-pri:#2c4752;--p30-ok:#1f5a45;--p30-off:#4a5560}

/* ---- lobby: top block (coins first) --------------------------------------------------------------------------------------------- */
.p30-lobby{max-width:1100px;margin:0 auto;padding-bottom:88px;color:var(--p30-ink)}
.p30-lobby h1{font-size:26px;line-height:1.3;margin:2px 0 12px;letter-spacing:0}
.p30-top{display:grid;gap:12px;padding:16px;border-radius:20px;background:#fff6dc;border:2px solid #e3cb86}
.p30-wallet{display:flex;align-items:center;gap:14px}
.p30-wallet .a28-coin{width:64px;height:64px;font-size:32px;flex:none;border-width:3px}
.p30-wallet small{display:block;font-size:16px;font-weight:800;line-height:1.3;color:#5b4710}
.p30-wallet strong{display:block;font-size:56px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--p30-ink)}
.p30-wallet strong span{font-size:18px;font-weight:700;color:var(--p30-sub);margin-left:4px}
.p30-slogan{margin:0;font-size:18px;line-height:1.6;font-weight:800;color:var(--p30-ink)}
.p30-earn{display:grid;gap:6px}
.p30-lobby .p30-earn .btn,.p30-guest .btn{width:100%;min-height:56px;font-size:19px;font-weight:850;justify-content:center}
.p30-earn small,.p30-note{display:block;font-size:14px;line-height:1.5;color:var(--p30-sub);margin:0}
.p30-lobby .notice,.p30-lobby .a28-break,.p30-lobby .a28-resume{font-size:16px;line-height:1.6;margin:14px 0 0}
.p30-lobby .notice{display:grid;gap:10px;justify-items:stretch}
.p30-lobby .notice .btn{width:100%;justify-content:center}
.p30-top-guest .p30-slogan{font-size:20px}
.p30-lobby .a28-break span,.p30-lobby .a28-resume p{font-size:16px;line-height:1.6;color:var(--p30-ink)}
.p30-lobby .a28-resume h2{font-size:20px}
.p30-lobby .a28-eyebrow{font-size:14px;letter-spacing:0;color:var(--p30-sub);text-transform:none}
.p30-lobby .a28-resume .btn,.p30-lobby .a28-break .btn,.p30-lobby .notice .btn{min-height:48px;font-size:16px}

@media(orientation:landscape) and (max-height:550px){
 .p30-top{grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:20px;padding:10px 16px}
 .p30-wallet strong{font-size:44px}
 .p30-top .p30-earn{grid-column:1/-1}
}

/* ---- lobby: sections, chips ------------------------------------------------------------------------------------------------------ */
.p30-sec{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:24px 0 10px}
.p30-sec h2{font-size:22px;line-height:1.3;margin:0}
.p30-sec span{font-size:15px;color:var(--p30-sub)}
.p30-lobby .a28-tabs{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;padding:0 0 14px}
.p30-lobby .a28-tabs .a28-btn{min-width:0;min-height:44px;padding:0 16px;font-size:15px;border-radius:24px}
.p30-lobby .a28-tabs .btn.soft{background:#e9e4d6;color:#2f4650;border-color:#d8d2c3}
.p30-lobby .a28-tabs .btn.primary{background:var(--p30-pri);color:#fff;border-color:var(--p30-pri)}
.p30-empty{font-size:16px;line-height:1.6;color:var(--p30-sub);margin:6px 0 0}

/* ---- lobby: game cards (one column on phones, big picture first) ----------------------------------------------------------------------- */
.p30-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.p30-card{display:grid;grid-template-columns:minmax(0,1fr);row-gap:6px;align-content:start;padding:10px;border-radius:18px;background:#fff;border:2px solid var(--p30-line);
 box-shadow:0 3px 0 color-mix(in srgb,var(--machine) 60%,#fff);color:var(--p30-ink)}
.a28-cabinet.p30-card[data-r2-new="true"]:before{content:none;display:none}
.p30-shot{position:relative;overflow:hidden;border:3px solid #263347;border-radius:12px;background:#253449}
.p30-shot .a28-thumb{aspect-ratio:10/7;width:100%;display:block;background:#eee9dd}
.p30-shot .a28-thumb img{width:100%;height:100%;display:block;object-fit:cover}
.p30-badge{position:absolute;left:8px;bottom:8px;padding:3px 10px;border-radius:999px;font-size:14px;line-height:1.35;font-weight:850;color:#fff;background:var(--p30-ok);box-shadow:0 1px 3px #0005}
.p30-badge.shut{background:var(--p30-off)}
.p30-card .a28-cabinet-body{display:contents}
.p30-card h3{margin:6px 2px 0;font-size:22px;line-height:1.35;color:var(--p30-ink);letter-spacing:0}
.p30-card .a28-cabinet-body p{min-height:0;margin:0 2px;color:var(--p30-ink)}
.p30-card .p30-en{font-size:14px;line-height:1.4;font-weight:700;letter-spacing:.4px;color:var(--p30-sub)}
.p30-card .p30-desc{font-size:15px;line-height:1.6;color:#2f3d4a}
.p30-card .a28-cabinet-body .a28-btn{width:100%;min-height:52px;margin-top:8px;font-size:18px;font-weight:850;padding:8px 12px;border-radius:14px;box-shadow:none}
.p30-card .a28-cabinet-body .a28-btn.primary{background:var(--p30-pri)!important;color:#fff!important;border:2px solid var(--p30-pri)!important}
.p30-card .a28-cabinet-body .a28-btn.secondary{background:#fff!important;color:var(--p30-pri)!important;border:2px solid var(--p30-pri)!important}
.p30-card .p30-note{text-align:center;font-size:14px;line-height:1.5;color:var(--p30-sub)}
.p30-card .wq32-cabinet-buddy{display:flex;align-items:center;justify-content:center;gap:8px;margin:0;padding:0;background:none;border:0}
.p30-card .wq32-cabinet-buddy img{width:28px;height:28px;border-radius:50%}
.p30-card .wq32-cabinet-buddy span{font-size:14px;line-height:1.4;color:var(--p30-sub);font-weight:700}
@media(min-width:640px){
 .p30-cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
}

/* ---- lobby: folded sections ------------------------------------------------------------------------------------------------------------- */
.p30-fold{margin:22px 0 0;border:2px solid var(--p30-line);border-radius:18px;background:#fff;overflow:hidden}
.p30-fold>summary{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 16px;font-size:18px;font-weight:850;line-height:1.4;cursor:pointer;color:var(--p30-ink);list-style:none}
.p30-fold>summary::-webkit-details-marker{display:none}
.p30-fold>summary::after{content:'＋';margin-left:auto;font-size:22px;font-weight:700}
.p30-fold[open]>summary::after{content:'－'}
.p30-fold-hint{font-size:14px;font-weight:600;color:var(--p30-sub)}
.p30-fold-body{padding:0 12px 14px}
.p30-more .p30-fold-body{display:grid;gap:14px}
.p30-more,.p30-more p,.p30-more small,.p30-more summary,.p30-more span,.p30-more strong,.p30-more h2,.p30-more h3{font-size:inherit}
.p30-more .a28-status-strip{grid-template-columns:1fr 1fr;gap:10px;margin:0;padding:12px;border-radius:14px}
.p30-more .a28-status-strip>div{display:block;padding:6px 8px;border:0}
.p30-more .a28-status-strip small{display:block;font-size:14px;color:var(--p30-sub);white-space:normal}
.p30-more .a28-status-strip strong{display:block;font-size:24px;margin-top:2px}
.p30-more .a28-status-strip strong span{font-size:14px;color:var(--p30-sub)}
.p30-more .a28-wardrobe{display:grid;grid-template-columns:1fr;gap:12px;margin:0;padding:14px;border-radius:16px}
.p30-more .a28-wardrobe .a28-eyebrow{font-size:14px;letter-spacing:0;text-transform:none;color:var(--p30-sub)}
.p30-more .a28-wardrobe h2{font-size:20px;margin:0 0 6px}
.p30-more .a28-wardrobe>div>p:last-child{font-size:15px;line-height:1.6;color:var(--p30-ink)}
.p30-more .a28-skins{gap:8px}
.p30-more .a28-skins article{padding:8px 6px 10px}
.p30-more .a28-skins h3{font-size:15px;line-height:1.3;margin:0 0 4px;color:var(--p30-ink)}
.p30-more .a28-skins p{font-size:14px;min-height:0;margin:0 0 6px;color:var(--p30-sub)}
.p30-more .a28-skins .a28-btn{font-size:14px;min-height:48px;padding:6px}
.p30-more details.a28-rules,.p30-more details.r2-records{margin:0;padding:0;border:2px solid var(--p30-line);border-radius:14px;background:#fff;font-size:15px;line-height:1.7;color:var(--p30-ink)}
.p30-more details.a28-rules>summary,.p30-more details.r2-records>summary{display:flex;align-items:center;min-height:52px;padding:8px 14px;font-size:16px;font-weight:800;color:var(--p30-ink);cursor:pointer}
.p30-more details.a28-rules>p,.p30-more details.r2-records>p,.p30-more details.r2-records>div{margin:0 14px 12px;font-size:15px}
.p30-more .r2-score-list span,.p30-more .r2-score-list strong{font-size:15px}
.p30-more .p30-parent-link{display:flex;min-height:52px;font-size:16px;justify-content:center}

.p30-more .wq32-actions .btn,.p30-more .wq32-actions button{min-height:48px;font-size:15px}

.p30-top-btn{position:fixed;left:12px;bottom:76px;z-index:90;display:none;align-items:center;justify-content:center;min-width:48px;min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--p30-pri);background:#fff;color:var(--p30-pri);font-size:16px;font-weight:850;box-shadow:0 4px 14px #1f2f3d33;cursor:pointer}

 .a28-dialog.p30-intro[open]{display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);align-items:start;max-height:96dvh;width:calc(100vw - 16px)}

.r37-pbar i{display:block;height:100%;border-radius:12px;background:var(--r37-cta);transition:width .3s var(--r37-ease)}
.r37-pips{align-items:center}
.r37-x{display:grid;place-items:center;padding:0}.r37-x .r37-ic{font-size:20px;color:#fff}
.r37-hearts{display:flex;gap:3px;align-items:center}
.r37-hearts i{display:block;width:24px;height:24px;line-height:0}
.r37-hearts .r37-ic{width:24px;height:24px;font-size:24px}
.r37-hearts .r37-ic .heart{fill:var(--r37-star-off)}.r37-hearts i.on .r37-ic .heart{fill:var(--r37-danger)}
.r37-hearts .r37-ic .h{stroke-opacity:.5}
.r37-hearts i:not(.on) .r37-ic .h{display:none}
.r37-stage{justify-content:flex-start;padding-top:12px;gap:12px}
.r37-comp{display:flex;align-items:center;gap:10px;width:100%;flex:none}
.r37-compav{width:64px;height:64px;flex:none}
.r37-bub{position:relative;padding:10px 14px;border-radius:16px;background:var(--r37-card-bg);border:1px solid var(--r37-card-line);font-weight:800;font-size:16px;color:var(--r37-text);line-height:1.3}
.r37-bub::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:rgba(30,38,96,.96);border-left:1px solid var(--r37-card-line);border-bottom:1px solid var(--r37-card-line);transform:translateY(-50%) rotate(45deg)}
.r37-comp.ok .r37-compav{animation:r37pop .3s var(--r37-ease)}
.r37-q{background:var(--r37-card-bg);border:1px solid var(--r37-card-line);color:var(--r37-text);border-radius:20px;box-shadow:0 4px 0 var(--r37-shade),0 12px 28px rgba(2,4,24,.35)}
.r37-qt{color:var(--r37-text)}
.r37-spk{background:var(--r37-glass);border:1px solid var(--r37-glass-line);display:grid;place-items:center;padding:0}.r37-spk .r37-ic{font-size:24px}
.r37-opts{margin-top:auto;padding-bottom:12px}
.r37-opt{border:1px solid var(--r37-card-line);background:var(--r37-card-bg);color:var(--r37-text);border-radius:20px;box-shadow:0 4px 0 var(--r37-shade)}
.r37-opt:active{box-shadow:0 1px 0 var(--r37-shade);transform:translateY(3px)}
.r37-opt kbd{color:#aab4ee}
.r37-opt.ok{background:linear-gradient(160deg,#1d7a52,#145a3d);border-color:#5fe08d;color:#fff}
.r37-opt.bad{background:linear-gradient(160deg,#4d3a99,var(--r37-nebula));border-color:#a994ff;color:#fff}
.r37-sc{color:#ffe9a8}
.r37-fill input{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.28);color:var(--r37-text)}
.r37-fill input::placeholder{color:#9aa5ea}
.r37-fill input:focus{outline:0;border-color:var(--r37-cta);box-shadow:0 0 0 3px rgba(255,201,74,.35)}
.r37-ok{background:var(--r37-cta);color:var(--r37-cta-ink);box-shadow:0 4px 0 var(--r37-cta-edge);border-radius:18px}
.r37-pfoot{padding-top:4px}
.r37-hintb{width:auto;min-width:48px;height:48px;border-radius:24px;padding:0 16px 0 12px;display:inline-flex;align-items:center;gap:6px;background:var(--r37-glass);border:1px solid var(--r37-glass-line);color:var(--r37-text);font:inherit;font-size:15px;font-weight:800}
.r37-hintb .r37-ic{font-size:24px}
.r37-hint{background:var(--r37-glass);border:1px solid var(--r37-glass-line);color:var(--r37-text)}
/* feedback: a wrong answer is nebula purple with a gold icon and a soft sentence, never a red bar */
.r37-fb{color:#fff;border-top:1px solid rgba(255,255,255,.18)}
.r37-fb.ok{background:linear-gradient(180deg,#1b7a52,#145a3d)}
.r37-fb.bad{background:linear-gradient(180deg,#4a3a96,var(--r37-nebula))}
.r37-fb>span{display:grid;place-items:center;width:44px;height:44px;flex:none;font-size:34px}
.r37-fb .r37-ic{font-size:36px}
.r37-fb.bad .r37-ic{--a:#ffc94a;--b:#c48a00}
.r37-fb b{font-size:19px;line-height:1.35;font-weight:900}
.r37-answ{color:var(--r37-cta);font-size:1.15em;letter-spacing:.02em}
.r37-next{display:grid;place-items:center;width:64px;height:56px;padding:0;border:0;border-radius:16px;background:var(--r37-cta);color:var(--r37-cta-ink);box-shadow:0 4px 0 var(--r37-cta-edge)}
.r37-next .r37-ic{font-size:26px;--a:#3b2600;--b:#3b2600}
.r37-next:active{transform:translateY(2px);box-shadow:0 2px 0 var(--r37-cta-edge)}
/* learn card: rows from the top bar, one full-width start button at the thumb */
.r37-wc{background:var(--r37-card-bg);border:1px solid var(--r37-card-line);color:var(--r37-text);border-radius:20px;box-shadow:0 4px 0 var(--r37-shade)}
.r37-wem{background:rgba(255,255,255,.1);width:64px;height:64px;font-size:40px;border-radius:18px}
.r37-wem .r37-svg{width:48px;height:48px}.r37-wem .r37-ic{width:40px;height:40px;font-size:40px}
.r37-wc span:last-child{color:#c3cbf7}
.r37-wc:focus-visible{outline:3px solid var(--r37-cta)}
.r37-go{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border:0;border-radius:18px;padding:0 28px;background:var(--r37-cta);color:var(--r37-cta-ink);font-size:22px;font-weight:900;box-shadow:0 4px 0 var(--r37-cta-edge);text-decoration:none}
.r37-go .r37-ic{font-size:24px;--a:#3b2600;--b:#3b2600}
.r37-go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--r37-cta-edge)}
.r37-stage>.r37-go{margin-top:auto;width:100%;margin-bottom:16px}
.r37-learn{margin-top:4px}
@media(max-width:520px){.r37-wc{min-height:76px}.r37-learn{gap:10px}}
/* result: trophy, stars, one detail row, three labelled buttons */
.r37-rb{font-size:0;line-height:0}
.r37-badge-win{display:block;width:clamp(96px,16vh,128px);height:auto;filter:drop-shadow(0 8px 14px rgba(2,4,24,.5))}
.r37-rb-ic .r37-ic{font-size:clamp(70px,14vh,110px)}
.r37-rdetail{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.r37-rd{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--r37-card-bg);border:1px solid var(--r37-card-line);font-weight:800;font-size:16px;color:var(--r37-text);font-variant-numeric:tabular-nums}
.r37-rd .r37-ic{font-size:20px}.r37-rd.r37-rc{border-color:rgba(255,201,74,.6)}
.r37-result .r37-rc{padding:0 14px;font-size:16px;background:var(--r37-card-bg);color:var(--r37-text)}
.r37-ra{align-items:stretch;justify-content:center;flex-wrap:wrap}
.r37-ra .r37-go,.r37-ra .r37-sec{flex-direction:column;gap:2px;min-width:92px;min-height:76px;padding:8px 14px;border-radius:20px;font-size:16px}
.r37-sec{display:inline-flex;align-items:center;justify-content:center;background:var(--r37-glass);border:1px solid var(--r37-glass-line);color:var(--r37-text);font-weight:800;box-shadow:none;width:auto;height:auto}
.r37-ai{display:grid}.r37-ai .r37-ic{font-size:28px}
.r37-ra .r37-go .r37-ai .r37-ic{--a:#3b2600;--b:#3b2600}
.r37-ra b{font-size:15px;font-weight:900;line-height:1.2}
.r37-fpsgo{background:var(--r37-glass);border:1px solid var(--r37-glass-line);color:var(--r37-text);box-shadow:none;border-radius:18px;display:inline-flex;align-items:center;gap:8px}
.r37-fpsgo .r37-ic{font-size:24px}
.r37-legbody .r37-ulv.r37-ufps{background:var(--r37-glass)!important;color:var(--r37-text)!important;box-shadow:none;border:1px solid var(--r37-glass-line)!important}
.r37-legbody .r37-ulv{background:var(--r37-cta)!important;color:var(--r37-cta-ink)!important;box-shadow:0 4px 0 var(--r37-cta-edge)}
.r37-legbody .r37-ulv.lock{background:var(--r37-glass)!important;color:#c3cbf7!important;box-shadow:none;border:1px solid var(--r37-glass-line)!important}
/* today summary (parent) */
.r37-todayrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.r37-todayrow span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:var(--r37-glass)}
.r37-todayrow .r37-ic{font-size:26px}.r37-todayrow b{font-size:22px;font-variant-numeric:tabular-nums}.r37-todayrow small{font-size:13px;color:var(--r37-muted);font-weight:700}
.r37-ptab{flex-direction:column;gap:2px;height:56px;min-width:72px}.r37-ptab b{font-size:14px;font-weight:800;line-height:1}
.r37-ptab .r37-ic{font-size:26px}
/* desktop answer screen: bigger prompt and options */
@media(min-width:1024px) and (min-height:640px){
 .r37-stage{max-width:760px}
 .r37-qt{font-size:40px}.r37-qt.long{font-size:30px}
 .r37-opt{font-size:32px;min-height:104px}
 .r37-q{padding:26px 24px}
}
/* top bar: ≤420px keeps only the avatar (name hidden) so the coin never truncates the title */
@media(max-width:420px){.r37-who .r37-wn{display:none}.r37-who{gap:0}}
@media(prefers-reduced-motion:reduce){.r37-pbar i,.r37-comp.ok .r37-compav{transition:none;animation:none}}
/* icons on gold buttons use the ink colour */
.r37-next .r37-ic,.r37-go .r37-ic,.r37-ok .r37-ic{color:var(--r37-cta-ink)}
.r37-next .r37-ic .a,.r37-go .r37-ic .a{fill:var(--r37-cta-ink)}

/* gold hero tiles: white text >= 4.5:1 on every hue */
.r37-hub[data-pl=math] .r37-tile.gold{--cl:27%}
.r37-hub[data-pl=english] .r37-tile.gold{--cl:38%}
.r37-hub[data-pl=olympiad] .r37-tile.gold,.r37-hub[data-pl=dictation] .r37-tile.gold{--cl:36%}
/* ---- maths dialogs (course / thinking tower): nebula backdrop + shell bar + bottom nav in the dialog's light DOM ---- */
dialog#wq-course-dialog,dialog#wqm-dialog{background-color:#0b1030!important;background-image:linear-gradient(180deg,rgba(7,10,38,.52),rgba(7,10,38,.3) 40%,rgba(7,10,38,.62)),url(assets/r316/bg_port.webp)!important;background-size:cover!important;background-position:center!important;background-attachment:fixed!important;color:#f4f6ff}
@media(orientation:landscape){dialog#wq-course-dialog,dialog#wqm-dialog{background-image:linear-gradient(180deg,rgba(7,10,38,.52),rgba(7,10,38,.3) 40%,rgba(7,10,38,.62)),url(assets/r316/bg_land.webp)!important}}
.r37-dshell .r37-bar{position:fixed!important;left:0;right:0;top:0;z-index:60;background:rgba(7,10,38,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.12);padding:8px 12px;min-height:64px}
.r37-dshell .r37-legt{margin-right:auto}
.r37-dshell .r37-nav{position:fixed!important;left:0;right:0;bottom:0;z-index:60;margin:0;width:100%;max-width:none}
@media(min-width:1024px) and (min-height:560px){.r37-dshell .r37-nav{left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100% - 32px));bottom:12px}}
@media(max-height:520px){.r37-dshell .r37-bar{padding:4px 10px;min-height:56px}}

.r37-opt.ok kbd,.r37-opt.bad kbd{color:#e6ecff}
@media(max-height:520px){.r37-fpsgo{min-height:44px;padding:4px 22px}}
.r37-node .r37-nu{text-shadow:0 1px 2px rgba(4,6,30,.6)}
/* landscape phones: no companion row, tighter stage so four options + hint fit; map stars keep clear of the next row */
@media(max-height:520px){
 .r37-comp,.r37-ptitle{display:none}
 .r37-stage{padding-top:4px;gap:6px}
 .r37-opts{margin-top:0;padding-bottom:2px}
 .r37-pfoot{min-height:52px;padding-top:0}
 .r37-path:not(.n3) .r37-node{width:min(100%,clamp(44px,20vh,64px),calc(40cqh - 8px))!important}
 .r37-path{padding-bottom:20px}
}
/* desktop answer screen: the card and its options sit together in the middle */
@media(min-width:1024px) and (min-height:640px){.r37-stage{justify-content:center}.r37-opts{margin-top:8px}.r37-stage>.r37-go{margin-top:12px}}

/* ================================================================================================
   R3.19 ui: hub tiles on short phones, map nodes that never overlap, companion reaction, hint label
   ================================================================================================ */
/* M02: games hub is a clean 2 x 2 on phones (the last tile no longer spans a whole row) */
@media(max-width:520px){.r37-gt .r37-tile.big:first-child~.r37-tile:last-child:nth-child(even){grid-column:span 1}}
/* odd tile count anywhere: the last one takes the whole row instead of leaving a hole */
@media(max-width:520px){.r37-tiles:not(.r37-gt):not(:has(>.r37-tile.big:first-child))>.r37-tile:last-child:nth-child(odd):not(:first-child){grid-column:1/-1}}
/* N05: 360x640 - tiles keep their content (icon 32px, label clear of the picture); the area scrolls rather than squashing */
@media(max-width:700px) and (max-height:700px) and (min-height:521px){
 .r37-tiles{overflow-y:auto;overscroll-behavior:contain;align-content:start;grid-auto-rows:minmax(84px,auto);gap:8px;padding:6px 14px 10px;scrollbar-width:none}
 .r37-tile{gap:3px;padding:6px 6px 8px;justify-content:center}
 .r37-ti{font-size:32px;width:1.5em;height:1.5em}
 .r37-tn{font-size:16px;line-height:1.2}
 .r37-tile .r37-ts{font-size:13px;margin-top:0}
 .r37-tile.gold{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;align-items:center;column-gap:12px;row-gap:0;min-height:112px;padding:10px 14px}
 .r37-tile.gold>.r37-ti{grid-row:1/3;grid-column:1;font-size:36px}
 .r37-tile.gold>.r37-tn{grid-column:2;grid-row:1;align-self:end;font-size:21px;white-space:nowrap}
 .r37-tile.gold>.r37-ts{grid-column:2;grid-row:2;align-self:start;padding-top:2px}
 .r37-tile.gold>.r37-tn:last-child{grid-row:1/3;align-self:center}
 .r37-tpl{max-width:38%;height:96%;right:-12%;bottom:-18%}
 .r37-gt{grid-auto-rows:minmax(84px,1fr)}
 .r37-gt .r37-tile{padding:6px 10px}
 .r37-gt .r37-ti{font-size:30px;width:1.45em;height:1.45em}
 .r37-gt .r37-tile.gold{display:flex;flex-direction:row;min-height:0;padding:6px 10px;gap:8px}
 .r37-gt .r37-tile.gold>.r37-tn{font-size:17px;white-space:nowrap}
 .r37-gt .r37-tile.gold .r37-tpl{height:88%;max-width:27%;right:-12%;bottom:-26%}
 .r37-gt .r37-tn{font-size:17px;white-space:nowrap}
}
/* N04: 360x640 map - 64px nodes in a scrolling trail, never squeezed into one screen */
@media(max-width:560px) and (max-height:700px) and (min-height:521px){
 .r37-path{container-type:normal;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;align-content:start}
 .r37-path:not(.n3){grid-template-rows:repeat(5,auto);gap:30px 6px;padding-top:14px;padding-bottom:34px}
 .r37-path:not(.n3) .r37-node{width:64px;height:64px;max-width:none;max-height:none;aspect-ratio:auto;justify-self:center}
 .r37-path:not(.n3) .r37-nn{font-size:26px}
 .r37-path.n3{grid-template-rows:repeat(3,auto);gap:34px;padding-top:12px;padding-bottom:40px}
 .r37-path.n3>.r37-node:nth-of-type(n){width:88px;height:88px;min-height:72px}
 .r37-trail{height:100%}
}
/* D14: the hint button says what it is */
.r37-hintb{min-width:96px;min-height:48px;gap:6px}
.r37-hintb b{font-size:15px;font-weight:800;line-height:1}
/* item 8: companion reactions - correct = hop + star dust, wrong = a gentle head-tilt and soft sway; <= 300ms, off under reduced motion */
.r37-comp{position:relative}
.r37-comp.ok .r37-compav{animation:r37chop .3s var(--r37-ease) both}
.r37-comp.no .r37-compav{animation:r37ctilt .3s ease-in-out both;transform-origin:50% 90%}
.r37-comp.ok::after{content:"";position:absolute;left:-10px;top:-10px;width:84px;height:84px;pointer-events:none;border-radius:50%;
 background:radial-gradient(3px 3px at 14% 30%,#ffe9a8 90%,transparent),radial-gradient(2.5px 2.5px at 50% 4%,#fff 90%,transparent),radial-gradient(3px 3px at 88% 26%,#ffc94a 90%,transparent),radial-gradient(2.5px 2.5px at 96% 66%,#fff 90%,transparent),radial-gradient(3px 3px at 74% 94%,#ffe9a8 90%,transparent),radial-gradient(2.5px 2.5px at 8% 76%,#ffc94a 90%,transparent);
 animation:r37cdust .3s ease-out both}
@keyframes r37chop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-9px) scale(1.08)}100%{transform:translateY(0) scale(1)}}
@keyframes r37ctilt{0%{transform:rotate(0)}30%{transform:rotate(-9deg) translateX(-2px)}65%{transform:rotate(5deg) translateX(2px)}100%{transform:rotate(0)}}
@keyframes r37cdust{0%{transform:scale(.55);opacity:0}30%{opacity:1}100%{transform:scale(1.3);opacity:0}}
@media(prefers-reduced-motion:reduce){.r37-comp.ok .r37-compav,.r37-comp.no .r37-compav,.r37-comp.ok::after{animation:none!important}.r37-comp.ok::after{opacity:0}}
.r37-wtitle small{white-space:nowrap}
@media(max-width:420px){.r37-wtitle{gap:8px;padding:6px 12px}.r37-wtitle small{gap:4px}.r37-wtitle small .r37-st{font-size:15px}.r37-wtitle h1{font-size:22px}}
/* R3.25: short landscape - the hub tile planet picture would sit on the label, so it is left out */
@media(max-height:520px){.r37-tile .r37-tpl{display:none}}
.wq-pic{object-fit:contain}

/* ===== R3.29 core fixes ===== */
/* A-10: five small stars under a map node (same scale as the result screen) */
.r37-node .r37-st3.r37-st5{gap:0}
.r37-node .r37-st3.r37-st5 i,.r37-node .r37-st3.r37-st5 .r37-ic{width:11px;height:11px;font-size:11px}
.r37-node.via{border-style:dashed}
/* A-18: difficulty chip with its words */
.r37-dch b{font-size:14px;font-weight:900;white-space:nowrap}
@media(max-width:380px){.r37-dch b{font-size:12px}.r37-dch{padding:6px 9px;gap:4px}}
/* A-01: parent assignment card on the English planet, chip on the galaxy home */
.r37-assign{position:relative;z-index:2;display:flex;align-items:center;gap:10px;margin:0 14px 6px;padding:5px 10px 5px 12px;min-height:50px;border-radius:18px;border:2px solid var(--r37-gold);background:linear-gradient(160deg,var(--r37-card2),var(--r37-card));color:#fff;flex:none;box-shadow:0 4px 0 var(--r37-shade)}
.r37-asi{display:grid;font-size:24px}.r37-ast{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.r37-ast small{font-size:12px;font-weight:800;color:var(--r37-gold)}.r37-ast b{font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r37-asgo{flex:none;min-width:68px;min-height:44px;padding:0 14px;border:0;border-radius:999px;background:var(--r37-gold);color:#2a1b00;font:inherit;font-size:16px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 3px 0 #c5942b}
.r37-asgo:focus-visible{outline:3px solid #fff;outline-offset:2px}
.r37-assignchip{position:relative;z-index:2;display:flex;align-items:center;gap:8px;margin:0 14px 6px;padding:0 14px;min-height:44px;border-radius:999px;border:1px solid var(--r37-gold);background:var(--r37-card);color:#fff;text-decoration:none;font-size:14px;font-weight:800;flex:none}
.r37-assignchip b{color:var(--r37-gold);white-space:nowrap}.r37-assignchip span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* C-25: finished missions waiting to be claimed */
.r37-qready{font-style:normal;font-size:14px;font-weight:900;padding:3px 10px;border-radius:999px;background:var(--r37-gold);color:#2a1b00;white-space:nowrap}
.r37-quest .r37-qready{margin-left:-4px}
b.r37-qready{font-size:13px;margin-left:4px}
/* A-08 */
.r37-dznote{margin:8px 14px 0;text-align:center;font-size:15px;font-weight:800;color:var(--r37-gold)}
/* C-24: the hint chip has words */
.r37-fhint{display:inline-flex;align-items:center;gap:4px;width:auto;padding:0 10px;font-size:20px}.r37-fhint b{font-size:13px;font-weight:900;color:#fff;white-space:nowrap}

class StarRhythm extends WQGame{
 constructor(a){super(a);this.period=60/[90,112,136][this.d];this.window=[.2,.145,.105][this.d];this.total=32;this.index=0;this.hits=0;this.perfect=0;this.combo=0;this.maxCombo=0;this.nextDue=this.period*5;this.hitCurrent=false;this.cue=this.period;this.mark='先聽四拍';this.markTime=2;this.points=Array.from({length:36},(_,i)=>({x:i*88,y:Math.sin(i*.85)*68+Math.cos(i*.45)*25}));this.tools([]);this.hint('先聽 4 拍預備。金球到光圈時，按一下空白鍵或拍子鈕。');}

 draw(){const c=this.c;D.bg(c,'night');for(let i=0;i<38;i++)D.circle(c,(i*137)%800,(i*79)%540,1.4,'#dfebc044');const pivot=this.points[this.index],map=p=>({x:345+p.x-pivot.x,y:288+p.y-pivot.y});const pts=this.points.slice(Math.max(0,this.index-5),this.index+7).map(map);D.line(c,pts,'#92b7a133',5);for(let i=Math.max(0,this.index-4);i<Math.min(this.points.length,this.index+6);i++){const p=map(this.points[i]);D.circle(c,p.x,p.y,14,i<=this.index?'#8cad98':'#355951','#789e86');}const next=map(this.points[this.index+1]),center=map(pivot),dx=next.x-center.x,dy=next.y-center.y,r=Math.hypot(dx,dy),targetA=Math.atan2(dy,dx),phase=(this.t-this.nextDue)/this.period,angle=targetA+phase*Math.PI*2;const orb={x:center.x+Math.cos(angle)*r,y:center.y+Math.sin(angle)*r};D.circle(c,center.x,center.y,r,null,'#a3c1a431');D.line(c,[center,orb],'#e2c07d55',3);D.circle(c,center.x,center.y,18,'#a5c3a1');D.circle(c,orb.x,orb.y,16,'#edc881');D.circle(c,orb.x-4,orb.y-5,5,'#fff4bf');const remaining=this.nextDue-this.t;if(remaining<this.period&&remaining>0)D.circle(c,next.x,next.y,16+remaining/this.period*40,null,'#f3d291');D.badge(c,this.t<this.period*4.2?'跟着預備拍輕拍，電腦會對準節拍':'把光圈，接成一段旋律',400,45,'#f5efdce0');if(this.markTime>0)D.text(c,this.mark,400,435,26,'#f1d599');for(let i=0;i<this.total;i++)D.round(c,105+i*18.5,493,13,9,4,i<this.index?'#abc193':'#48665d');D.text(c,`${this.hits} / ${this.total} 拍`,400,533,14,'#b9cba6');}

{const A=StarRhythm.prototype.act;StarRhythm.prototype.act=function(k){

const bounds={hour:[0,23],minute:[0,59],angle:[0,180],sx:[1,5],sy:[1,5],sz:[1,5],rulerStart:[0,19],rulerEnd:[1,20],chartA:[0,20],chartB:[0,20],chartC:[0,20]};

function arithmetic(a,b,op){return arithmeticTrace(a,b,op).steps;}
function stepsFor(q,t,lib){const p=q.params,k=q.skill,kind=t.verification?.kind,ans=q.displayAnswer||q.answer;
 if(t.school){const values={...p,result:q.type==='fraction'?p.result:fmt(p.result)};return t.school.steps.map(s=>C.fill(s,values));}

 if(q.type==='remainder'){const a=+p.a,b=+p.b,n=+q.answer,r=+q.remainder;return [`${a} 要每 ${b} 個一組，找不超過 ${a} 的最大 ${b} 的倍數。`,`${b} × ${n} ＝ ${b*n}，已分去 ${b*n} 個。`,`餘下：${a} − ${b*n} ＝ ${r}。`,`商是 ${n}，餘數 ${r} 小於除數 ${b}；${b} × ${n} ＋ ${r} ＝ ${a}。`];}

 if(k==='6N4.R3'){if(t.id.includes('T2'))return [`原來 ${p.total} 本是100%。`,`增加的數量：${p.total} × ${p.percent}% ＝ ${calc('total*percent/100',p)} 本。`,`原有加增加：${p.total} ＋ ${calc('total*percent/100',p)} ＝ ${ans} 本。`];if(t.id.includes('T3'))return [`原來 ${p.total} 張是100%。`,`用去的數量：${p.total} × ${p.percent}% ＝ ${calc('total*percent/100',p)} 張。`,`原有減用去：${p.total} − ${calc('total*percent/100',p)} ＝ ${ans} 張。`];return [`${p.percent}% 即每100份取 ${p.percent} 份。`,`把全部 ${p.total} 本乘 ${p.percent}/100。`,`${p.total} × ${p.percent}/100 ＝ ${ans} 本。`];}
 // Retain the topic-specific method, and expand calculable nested operations into actual worked steps.

 let extra=[];try{const ast=C.substitute(C.parseExpr(expr),p),seen=new Set();function walk(a){if(!Array.isArray(a)||a[0]==='num'||a[0]==='var')return;for(const v of a.slice(1))if(Array.isArray(v))walk(v);if(a.length===3&&['+','-','*','/'].includes(a[0])){const text=`${fmt(C.evaluate(a[1]).toString())} ${{'+':'＋','-':'−','*':'×','/':'÷'}[a[0]]} ${fmt(C.evaluate(a[2]).toString())} ＝ ${fmt(C.evaluate(a).toString())}`;if(!seen.has(text)){extra.push(text+'。');seen.add(text);}}}walk(ast);}catch(_){}

function enrich(q,lib){const t=lib.templates.get(q.templateId)||lib.archived.get(q.templateId);q.school=t.school||null;q.objective=t.school?.objective||lib.skills.get(q.skill).name_zh;

const text=(x,y,t,size=24,fill='#293458')=>`<text x="${x}" y="${y}" text-anchor="middle" fill="${fill}" font-size="${size}" font-weight="650">${esc(t)}</text>`;

   const sessions=new Set(n.sessions.map(x=>[x.at,x.skill,x.track,x.attempts,x.correct].join('|')));for(const x of source.sessions){const sig=[x.at,x.skill,x.track,x.attempts,x.correct].join('|');if(!sessions.has(sig)){n.sessions.push({...C.clone(x),id:prefix+x.id.slice(-70)});sessions.add(sig);}}

   C.validateState(n,this.lib);if(this.lastRaw)localStorage.setItem(this.key+':before-restore',this.lastRaw);this.commit(n);

<script data-course-m1="classroom_ui.js">

(function(root){'use strict';

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function teacher(key){const p=packs[key],t=p.teacher;return `<details class="classroom-teacher"><summary>${esc(C.teacherTitle)}</summary><h3>${esc(C.objectiveLabel)}</h3><p>${esc(t.objective)}</p><dl>${[[C.materialsLabel,t.materials.join('、')],[C.observeLabel,t.lookFor],[C.supportLabel,t.ifStuck],[C.extendLabel,t.extension]].map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>${t.notes?`<p>${esc(t.notes)}</p>`:''}${p.modelNotes?.length?`<h3>${esc(C.modelNotesTitle)}</h3><ul>${p.modelNotes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<p>${esc(p.connections)}</p></details>`;}
function words(p){return `<details class="classroom-words"><summary>${esc(C.vocabularyTitle)}</summary><dl>${p.vocabulary.map(w=>`<div><dt>${esc(w.term)}</dt><dd>${esc(w.meaning)}</dd></div>`).join('')}</dl></details>`;}
function intro(key){const p=packs[key],s=state(key),r=p.readiness;let body='';
 if(s.stage==='warmup')body=`<span class="pill gold">${esc(C.warmupTitle)}</span><h2 id="classroom-heading" tabindex="-1">${esc(r.prompt)}</h2>${fig(r.diagram)}<div class="classroom-choices">${r.choices.map(x=>{const mk=s.checked&&s.choice?(x.id===r.answer?'ok':x.id===s.choice?'bad':''):'';return `<button class="btn soft${mk?' mk-'+mk:''}" data-c1="classroom:pick:${x.id}" aria-pressed="${s.choice===x.id}">${mk==='ok'?'✓ ':mk==='bad'?'✕ ':''}${esc(x.text)}</button>`;}).join('')}</div><div class="actions">${btn(C.warmupCheck,'check',s.choice?'':'disabled')}${btn(C.warmupHelp,'help')}</div>${s.checked||s.help?`<div class="classroom-feedback${s.checked&&s.choice?(s.choice===r.answer?' fb-ok':' fb-no'):''}" role="status">${s.checked&&s.choice?`<h3 class="fb-head ${s.choice===r.answer?'ok':'no'}">${s.choice===r.answer?'✓ 答對了！':'✕ 再想想，答案是 '+esc(r.choices.find(x=>x.id===r.answer)?.text||'')}</h3>`:''}<p>${esc(s.help||s.choice===r.answer?r.explanation:r.retry)}</p></div>`:''}<div class="actions">${btn(C.nextModel,'stage:model')}</div>${words(p)}`;
 else{const steps=p.modelSteps?.length?p.modelSteps:[p.explain.model];s.model=Math.min(s.model,steps.length-1);body=`<span class="pill gold">${esc(C.modelTitle)} · ${s.model+1}/${steps.length}</span><h2 id="classroom-heading" tabindex="-1">${esc(C.modelTitle)}</h2>${fig(p.diagram)}<p class="classroom-sentence" aria-live="polite">${esc(steps[s.model])}</p><div class="actions">${s.model?btn('←','model:'+(s.model-1),'aria-label="上一步"'):btn(C.backWarmup,'stage:warmup')}${s.model<steps.length-1?btn('→','model:'+(s.model+1),'aria-label="下一步"'):btn(C.nextModel,'stage:examples')}</div>${words(p)}`;}
 return `<section class="panel classroom-panel" data-classroom="intro">${body}</section>${teacher(key)}`;
}
function board(key){const s=state(key);let body='';
 if(s.pad==='drawing')body=`<p class="small">${esc(C.drawingInstructions)}</p><svg class="classroom-canvas" viewBox="0 0 640 320" role="img" aria-label="${esc(C.drawingTitle)}"><defs><pattern id="classroom-paper" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce3e5" stroke-width="1"/></pattern></defs><rect width="640" height="320" fill="url(#classroom-paper)"/><g class="classroom-ink" fill="none" stroke="#284f65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${s.paths.map(d=>`<path d="${d}"/>`).join('')}</g></svg>${btn(C.clearDrawing,'clear')}`;
 if(s.pad==='grid')body=`<p class="small">${esc(C.gridInstructions)}</p><div class="classroom-grid">${Array.from({length:40},(_,i)=>btn(String(i+1),'cell:'+i,`aria-label="第${Math.floor(i/5)+1}行，第${i%5+1}格" aria-pressed="${s.grid.includes(i)}"`)).join('')}</div><p class="small" aria-live="polite">${s.grid.length} / 40</p>${btn(C.gridClear,'clear')}`;
 if(s.pad==='counter')body=`<output class="classroom-number" aria-live="polite">${s.count}</output><div class="classroom-counters" aria-hidden="true">${Array.from({length:s.count},()=>'<i></i>').join('')}</div><div class="actions">${btn(C.counterRemove,'count:-1',s.count?'':'disabled')}${btn(C.counterAdd,'count:1',s.count>=30?'disabled':'')}</div>`;
 if(s.pad==='number')body=`<output class="classroom-number" aria-live="polite">${s.number}</output><div class="classroom-numberline">${Array.from({length:21},(_,i)=>`<span class="${i===s.number?'current':''}">${i===s.number?'<b aria-hidden="true">▼</b>':''}${i}</span>`).join('')}</div><div class="actions">${btn(C.numberBack,'number:-1',s.number?'':'disabled')}${btn(C.numberForward,'number:1',s.number>=20?'disabled':'')}</div>`;

}
function workshop(key,live=false){const p=packs[key],s=state(key);s.task=Math.min(s.task,p.toolTask.length-1);return `<div class="classroom-panel" data-classroom="workshop" data-live="${live}"><span class="pill gold">${esc(C.toolTitle)} · ${s.task+1}/${p.toolTask.length}</span><p class="classroom-sentence" aria-live="polite">${esc(p.toolTask[s.task])}</p><div class="classroom-task-nav">${btn('←','task:'+(s.task-1),`aria-label="上一個動作" ${s.task?'':'disabled'}`)}${btn('→','task:'+(s.task+1),`aria-label="下一個動作" ${s.task+1>=p.toolTask.length?'disabled':''}`)}</div>${!live?fig(p.diagram)+board(key):`<details><summary>${esc(C.drawingTitle)}</summary>${fig(p.diagram)}${board(key)}</details>`}</div>`;}
function explain(key){const p=packs[key],s=state(key);return `<section class="panel classroom-panel" data-classroom="explain"><span class="pill gold">${esc(C.explainTitle)}</span><h2 id="classroom-heading" tabindex="-1">${esc(p.explain.prompt)}</h2>${fig(p.diagram)}${btn(C.talkCheck,'reveal',`aria-expanded="${s.revealed}"`)}${s.revealed?`<div class="classroom-feedback"><p>${esc(p.explain.model)}</p></div><details class="classroom-misconception"><summary>${esc(C.misconceptionTitle)}</summary><p>${esc(p.misconception.wrongIdea)}</p><p>${esc(p.misconception.repair)}</p></details>`:''}<div class="actions">${go(C.nextTool,1)}${go(C.nextPractice,3)}</div></section>${teacher(key)}`;}
function act(key,action){const s=state(key),[type,value]=action.split(':');
 if(type==='stage'){s.stage=value;s.model=0;}
 if(type==='model')s.model=Number(value);
 if(type==='pick'){s.choice=value;s.checked=false;s.help=false;}
 if(type==='check')s.checked=!!s.choice;
 if(type==='help')s.help=true;
 if(type==='reveal')s.revealed=!s.revealed;
 if(type==='task')s.task=Math.max(0,Math.min(packs[key].toolTask.length-1,Number(value)));
 if(type==='pad')s.pad=value;
 if(type==='cell'){const n=Number(value);if(n>=0&&n<40)s.grid=s.grid.includes(n)?s.grid.filter(x=>x!==n):[...s.grid,n];}
 if(type==='count')s.count=Math.max(0,Math.min(30,s.count+Number(value)));
 if(type==='number')s.number=Math.max(0,Math.min(20,s.number+Number(value)));
 if(type==='clear'){if(s.pad==='drawing')s.paths=[];if(s.pad==='grid')s.grid=[];}
}
/* answer cue: the app's right / wrong sound (host bridge, absent in the stand-alone preview) and the feedback scrolled into view next to the options */
function cue(app,ok,anchorSel){
 const head=app.querySelector('.fb-head');if(!head)return false;
 try{root.WQAnswerSfx&&root.WQAnswerSfx(ok);}catch(e){}
 try{
  const doc=root.document,up=n=>n.parentElement||(n.getRootNode&&n.getRootNode().host)||null;
  let sc=up(head);while(sc&&sc!==doc.body&&sc!==doc.documentElement){if(/(auto|scroll)/.test(root.getComputedStyle(sc).overflowY)&&sc.scrollHeight>sc.clientHeight+2)break;sc=up(sc);}
  let top=0,bottom=root.innerHeight;
  const nav=doc.querySelector('dialog[open] .r37-nav')||doc.querySelector('.r37-nav');if(nav&&root.getComputedStyle(nav).position==='fixed')bottom=Math.min(bottom,nav.getBoundingClientRect().top);
  const bar=doc.querySelector('dialog[open] .r37-bar,dialog[open] .r37-dbar');if(bar)top=Math.max(top,bar.getBoundingClientRect().bottom);
  const anchor=anchorSel&&app.querySelector(anchorSel),h=head.getBoundingClientRect(),a=anchor?anchor.getBoundingClientRect():h;
  const hb=h.bottom+56,avail=bottom-top-16;let dy=0;
  if(hb-Math.min(a.top,h.top)<=avail){if(hb>bottom-8)dy=hb-(bottom-8);else if(Math.min(a.top,h.top)<top+8)dy=Math.min(a.top,h.top)-(top+8);}
  else dy=h.top-(top+12);
  if(Math.abs(dy)>=2){if(sc&&sc!==doc.body&&sc!==doc.documentElement)sc.scrollTop+=dy;else root.scrollBy(0,dy);}
 }catch(e){}
 return true;
}
function mount(scope,key){const svg=scope.querySelector('.classroom-canvas');if(!svg||svg.dataset.bound)return;svg.dataset.bound='true';let stroke=null,path=null;const s=state(key);
 const point=e=>{const r=svg.getBoundingClientRect();return [Math.max(0,Math.min(640,(e.clientX-r.left)/r.width*640)),Math.max(0,Math.min(320,(e.clientY-r.top)/r.height*320))].map(n=>n.toFixed(1)).join(' ');};
 svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();svg.setPointerCapture(e.pointerId);stroke='M'+point(e);path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',stroke);svg.querySelector('.classroom-ink').append(path);});
 svg.addEventListener('pointermove',e=>{if(!stroke)return;stroke+=' L'+point(e);path.setAttribute('d',stroke);});
 const finish=()=>{if(stroke){s.paths.push(stroke);if(s.paths.length>150)s.paths.shift();}stroke=null;path=null;};svg.addEventListener('pointerup',finish);svg.addEventListener('pointercancel',finish);
}
function handle(app,key,action,button,render){if(action==='zoom'){const box=button.closest('.classroom-figure'),expanded=box.classList.toggle('expanded');button.setAttribute('aria-expanded',String(expanded));button.textContent=expanded?'縮小圖卡':'＋ 放大本題圖';return;}act(key,action);const container=button.closest('[data-classroom]');if(container?.dataset.classroom==='workshop'){const live=container.dataset.live==='true',opened=container.querySelector('details')?.open;container.outerHTML=workshop(key,live);const details=app.querySelector('[data-classroom=workshop] details');if(details&&opened)details.open=true;mount(app,key);}else render();if(action==='check'){const s2=state(key);if(s2.choice)cue(app,s2.choice===packs[key].readiness.answer,'.classroom-choices');}if(action.startsWith('stage:')||action.startsWith('model:')){const heading=app.querySelector('#classroom-heading')||app.querySelector('#c2-card-title');heading?.focus({preventScroll:true});heading?.scrollIntoView({block:'nearest'});}else{const target=[...app.querySelectorAll('[data-c1]')].find(b=>b.dataset.c1==='classroom:'+action&&!b.disabled);target?.focus({preventScroll:true});}}
root.WQClassroom={get:key=>packs[key],state,intro,workshop,explain,teacher,mount,handle,cue,reset:()=>states.clear()};
})(globalThis);
